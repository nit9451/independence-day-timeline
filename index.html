<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatches from the Freedom Struggle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:wght@400;500;600&family=Courier+Prime&display=swap');

  :root{
    --paper:#ede4d0;
    --paper-light:#f7f1e3;
    --ink:#2b2620;
    --ink-soft:#5a5040;
    --saffron:#c1631f;
    --green:#1b5e3a;
    --stamp:#2c4a6e;
    --line:#c9bca0;
    --danger:#8c3b2b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Source Serif 4', serif;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 40%),
      repeating-linear-gradient(90deg, rgba(43,38,32,0.02) 0px, rgba(43,38,32,0.02) 1px, transparent 1px, transparent 3px);
  }
  .wrap{ max-width:920px; margin:0 auto; padding:36px 20px 80px; }

  /* MASTHEAD */
  .masthead{ text-align:center; border-top:4px double var(--ink); border-bottom:4px double var(--ink);
    padding:18px 10px 22px; margin-bottom:8px; }
  .masthead .kicker{ font-family:'Courier Prime', monospace; font-size:11px; letter-spacing:2px;
    text-transform:uppercase; color:var(--saffron); margin-bottom:6px; }
  .masthead h1{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(30px,5vw,46px);
    margin:0; letter-spacing:0.5px; line-height:1.05; }
  .masthead .dateline{ font-family:'Courier Prime', monospace; font-size:12px; color:var(--ink-soft);
    margin-top:10px; letter-spacing:0.5px; }
  .masthead .dateline span{ color:var(--green); font-weight:700; }

  /* FREEDOM METER */
  .meter-wrap{ margin:22px 0 30px; text-align:center; }
  .meter-label{ font-family:'Courier Prime', monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:1.5px; color:var(--ink-soft); margin-bottom:8px; }
  .meter-track{ height:6px; background:var(--line); border-radius:3px; position:relative; overflow:visible; }
  .meter-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--saffron), var(--ink-soft) 50%, var(--green));
    border-radius:3px; transition:width 1.2s cubic-bezier(.4,0,.2,1); }
  .meter-years{ display:flex; justify-content:space-between; font-family:'Courier Prime', monospace;
    font-size:10.5px; color:var(--ink-soft); margin-top:6px; }

  /* ERA TABS */
  .era-tabs{ display:flex; gap:10px; justify-content:center; margin-bottom:36px; flex-wrap:wrap; }
  .era-tab{ font-family:'Fraunces', serif; font-weight:600; font-size:14px; background:var(--paper-light);
    border:1.5px solid var(--ink); padding:9px 20px; border-radius:2px; cursor:pointer; color:var(--ink);
    letter-spacing:0.3px; transition:all .15s; }
  .era-tab:hover{ background:var(--ink); color:var(--paper-light); }
  .era-tab.active{ background:var(--ink); color:var(--paper-light); }
  .era-tab .yrs{ display:block; font-family:'Courier Prime', monospace; font-size:10px; opacity:0.75; margin-top:2px; }

  /* TIMELINE */
  .timeline{ position:relative; padding-left:0; }
  .thread{ position:absolute; left:50%; top:0; bottom:0; width:2px; background:
    repeating-linear-gradient(0deg, var(--ink) 0px, var(--ink) 6px, transparent 6px, transparent 12px);
    transform:translateX(-50%); opacity:0.35; }
  .era-block{ display:none; }
  .era-block.active{ display:block; animation:fadein .35s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .dispatch-row{ position:relative; display:flex; margin-bottom:6px; }
  .dispatch-row.left .dispatch{ margin-right:auto; }
  .dispatch-row.right .dispatch{ margin-left:auto; }
  .dispatch{ width:calc(50% - 34px); position:relative; }

  .stamp{ position:absolute; top:14px; width:58px; height:58px; border-radius:50%;
    border:2px solid var(--stamp); display:flex; align-items:center; justify-content:center;
    background:var(--paper-light); z-index:2; left:50%; transform:translateX(-50%); }
  .dispatch-row.left .stamp{ transform:translateX(calc(-50% + 34px)); }
  .dispatch-row.right .stamp{ transform:translateX(calc(-50% - 34px)); }
  .stamp .yr{ font-family:'Courier Prime', monospace; font-weight:700; font-size:12px; color:var(--stamp); text-align:center; line-height:1.1; }

  .dispatch-card{ background:var(--paper-light); border:1px solid var(--line); border-radius:2px;
    padding:16px 18px 14px; margin-top:44px; cursor:pointer; position:relative;
    box-shadow:2px 3px 0 rgba(43,38,32,0.08); transition:box-shadow .15s, transform .15s; }
  .dispatch-card:hover{ box-shadow:3px 5px 0 rgba(43,38,32,0.14); transform:translateY(-1px); }
  .dispatch-card::before{ content:""; position:absolute; top:-1px; left:14px; right:14px; height:4px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); opacity:0.7; }

  .dh-top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .dh-icon{ width:26px; height:26px; flex-shrink:0; color:var(--saffron); }
  .dh-tag{ font-family:'Courier Prime', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:1px; color:var(--ink-soft); }
  .dh-title{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin:2px 0 6px; line-height:1.25; }
  .dh-teaser{ font-size:13.5px; line-height:1.55; color:var(--ink); margin:0; }
  .dh-full{ display:none; font-size:13.5px; line-height:1.6; color:var(--ink); margin-top:8px;
    padding-top:8px; border-top:1px dashed var(--line); }
  .dh-full.show{ display:block; }
  .dh-toggle{ font-family:'Courier Prime', monospace; font-size:10.5px; color:var(--stamp);
    margin-top:8px; text-transform:uppercase; letter-spacing:0.5px; }

  @media(max-width:720px){
    .thread{ left:29px; }
    .dispatch-row.left .dispatch, .dispatch-row.right .dispatch{ margin:0; width:100%; padding-left:60px; }
    .stamp{ left:29px !important; transform:translateX(-50%) !important; top:44px; width:44px; height:44px; }
    .dispatch-card{ margin-top:0; }
  }

  footer{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:40px; padding-top:16px;
    border-top:1px solid var(--line); font-family:'Courier Prime', monospace; }

  /* ===== ANIMATION & PLAYFULNESS ===== */

  /* card entrance */
  .dispatch-row{ opacity:0; transform:translateY(18px); animation:cardIn .55s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }

  /* alternating pinned-note tilt, straighten on hover */
  .dispatch-row.left .dispatch-card{ transform:rotate(-0.6deg); }
  .dispatch-row.right .dispatch-card{ transform:rotate(0.6deg); }
  .dispatch-card{ transition:transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; }
  .dispatch-card:hover{ transform:rotate(0deg) translateY(-3px) scale(1.015) !important;
    box-shadow:4px 7px 0 rgba(43,38,32,0.16); }

  /* gentle floating stamp */
  .stamp{ animation:stampFloat 3.6s ease-in-out infinite; }
  .stamp:nth-child(1){ animation-delay:0s; }
  @keyframes stampFloat{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(-3px); } }
  .dispatch-row.left .stamp{ animation-name:stampFloatLeft; }
  .dispatch-row.right .stamp{ animation-name:stampFloatRight; }
  @keyframes stampFloatLeft{ 0%,100%{ transform:translateX(calc(-50% + 34px)) translateY(0); } 50%{ transform:translateX(calc(-50% + 34px)) translateY(-3px); } }
  @keyframes stampFloatRight{ 0%,100%{ transform:translateX(calc(-50% - 34px)) translateY(0); } 50%{ transform:translateX(calc(-50% - 34px)) translateY(-3px); } }

  /* spinning charkha icon */
  .dh-icon.spin-icon svg{ animation:spinCharkha 6s linear infinite; transform-origin:50% 50%; }
  @keyframes spinCharkha{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .dispatch-card:hover .dh-icon svg{ transform:scale(1.15); transition:transform .2s; }

  /* smooth expand */
  .dh-full{ display:block; max-height:0; overflow:hidden; opacity:0;
    transition:max-height .4s cubic-bezier(.3,.9,.3,1), opacity .3s, margin-top .3s, padding-top .3s;
    margin-top:0; padding-top:0; border-top:none; }
  .dh-full.show{ max-height:400px; opacity:1; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .dh-toggle{ display:flex; align-items:center; gap:5px; }
  .dh-chevron{ display:inline-block; transition:transform .3s; font-size:9px; }
  .dh-chevron.rotated{ transform:rotate(180deg); }

  /* meter shimmer + moving year badge */
  .meter-track{ overflow:visible; }
  .meter-fill{ position:relative; overflow:hidden; }
  .meter-fill::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation:shimmer 2.2s ease-in-out infinite; }
  @keyframes shimmer{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(100%); } }
  .meter-badge{ position:absolute; top:-26px; transform:translateX(-50%); font-family:'Courier Prime', monospace;
    font-size:11px; font-weight:700; color:var(--stamp); background:var(--paper-light); border:1px solid var(--stamp);
    border-radius:10px; padding:1px 8px; white-space:nowrap; transition:left 1.2s cubic-bezier(.4,0,.2,1); }
  .meter-badge::after{ content:""; position:absolute; bottom:-5px; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:var(--stamp); }

  /* era tab press */
  .era-tab{ position:relative; overflow:hidden; }
  .era-tab:active{ transform:scale(0.96); }

  /* typewriter dateline */
  .dateline .type-text{ border-right:2px solid var(--green); padding-right:2px; }
  .dateline.done .type-text{ border-right:none; }

  /* ===== HOIST THE FLAG ===== */
  .hoist-wrap{ display:flex; flex-direction:column; align-items:center; margin:34px 0 8px; }
  .hoist-btn{ font-family:'Fraunces', serif; font-weight:600; font-size:14.5px; background:var(--ink);
    color:var(--paper-light); border:none; padding:11px 26px; border-radius:2px; cursor:pointer;
    letter-spacing:0.3px; transition:transform .15s, background .15s; box-shadow:2px 3px 0 rgba(43,38,32,0.25); }
  .hoist-btn:hover{ background:var(--green); }
  .hoist-btn:active{ transform:translateY(2px); box-shadow:1px 1px 0 rgba(43,38,32,0.25); }
  .hoist-btn:disabled{ opacity:0.5; cursor:default; }

  .pole-scene{ margin-top:22px; height:230px; position:relative; width:120px; }
  .pole{ position:absolute; bottom:0; left:58px; width:5px; height:210px;
    background:linear-gradient(90deg,#5c4e38,#8a7a5c 40%,#5c4e38); border-radius:2px; box-shadow:1px 0 2px rgba(0,0,0,0.15); }
  .pole-base{ position:absolute; bottom:0; left:48px; width:26px; height:8px; background:#4a3f2e; border-radius:2px; }
  .pulley{ position:absolute; top:0; left:52px; width:16px; height:16px; border-radius:50%;
    background:#3a3226; border:2px solid #6b5d43; z-index:3; }
  .pulley::after{ content:""; position:absolute; inset:4px; border-radius:50%; background:#1f1a13; }
  .rope{ position:absolute; top:8px; width:1.6px; background:#b7ac92; z-index:1; }
  .rope.rope-left{ left:57px; height:0; }
  .rope.rope-right{ left:63px; height:8px; }
  .rope-cleat{ position:absolute; bottom:70px; left:66px; width:8px; height:5px; background:#4a3f2e; border-radius:1px; }

  .flag-hoist{ position:absolute; left:59px; bottom:8px; width:6px; height:14px; transform-origin:0% 0%; }
  .flag-hoist svg{ position:absolute; left:0; top:0; overflow:visible; }
  .flag-furled{ width:6px; height:44px; }
  .flag-furled rect{ fill:#c9a227; }

  .flag-hoist.hoisting{ animation:flagRiseRealistic 2.6s cubic-bezier(.22,.85,.15,1.15) forwards; }
  @keyframes flagRiseRealistic{
    0%{ bottom:8px; }
    70%{ bottom:186px; }
    85%{ bottom:172px; }
    100%{ bottom:180px; }
  }
  .flag-hoist .furled-wrap{ transition:opacity .3s; }
  .flag-hoist.unfurled .furled-wrap{ opacity:0; }
  .flag-hoist .cloth-wrap{ opacity:0; transform:scaleX(0.05); transform-origin:0% 50%;
    transition:opacity .5s ease .1s, transform .9s cubic-bezier(.2,.9,.25,1.2) .1s; }
  .flag-hoist.unfurled .cloth-wrap{ opacity:1; transform:scaleX(1); }

  .rope-right.pulling{ animation:ropeShorten 2.6s cubic-bezier(.22,.85,.15,1.15) forwards; }
  @keyframes ropeShorten{ from{ height:8px; } to{ height:180px; } }
  .rope-left.paying-out{ animation:ropeLengthen 2.6s cubic-bezier(.22,.85,.15,1.15) forwards; }
  @keyframes ropeLengthen{ from{ height:0; } to{ height:172px; } }

  .flag-cloth-ripple{ animation:clothSway 3.4s ease-in-out infinite; transform-origin:0% 50%; }
  @keyframes clothSway{ 0%,100%{ transform:rotate(0deg) skewY(0deg); } 25%{ transform:rotate(1.2deg) skewY(2deg); }
    50%{ transform:rotate(0.2deg) skewY(-1deg); } 75%{ transform:rotate(1.6deg) skewY(2.5deg); } }

  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
  .confetti-piece{ position:absolute; top:-20px; border-radius:1px; animation:confettiFall linear forwards; }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(540deg); opacity:0.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .dispatch-row, .stamp, .dh-icon.spin-icon svg, .meter-fill::after, .flag-hoist.waving .flag-cloth{
      animation:none !important;
    }
    .dispatch-card{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="kicker">Independence Day · 15 August</div>
    <h1>Dispatches from the Freedom Struggle</h1>
    <div class="dateline" id="datelineWrap"><span class="type-text" id="typeText"></span></div>
  </div>

  <div class="meter-wrap">
    <div class="meter-label">The road to midnight, 15 August 1947</div>
    <div class="meter-track">
      <div class="meter-fill" id="meterFill"></div>
      <div class="meter-badge" id="meterBadge">1880</div>
    </div>
    <div class="meter-years"><span>1857</span><span>1900</span><span>1947</span></div>
  </div>

  <div class="era-tabs" id="eraTabs">
    <button class="era-tab active" data-era="1">The Awakening<span class="yrs">1857 – 1905</span></button>
    <button class="era-tab" data-era="2">Mass Mobilisation<span class="yrs">1905 – 1930</span></button>
    <button class="era-tab" data-era="3">The Final Push<span class="yrs">1930 – 1947</span></button>
  </div>

  <div class="timeline">
    <div class="thread"></div>
    <div id="timelineContent"></div>
  </div>

  <footer>An independently compiled overview for Independence Day &mdash; not exhaustive. Dates and details condensed for readability.</footer>

  <div class="hoist-wrap">
    <button class="hoist-btn" id="hoistBtn">Hoist the Flag 🇮🇳</button>
    <div class="pole-scene">
      <div class="pole"></div>
      <div class="pole-base"></div>
      <div class="pulley"></div>
      <div class="rope rope-left" id="ropeLeft"></div>
      <div class="rope rope-right" id="ropeRight"></div>
      <div class="rope-cleat"></div>

      <div class="flag-hoist" id="flagHoist">
        <div class="furled-wrap">
          <svg width="10" height="46" viewBox="0 0 10 46">
            <rect x="0" y="0" width="6" height="44" rx="1.5" fill="#c9a227"/>
            <rect x="0" y="6" width="6" height="1.5" fill="#8a6d15"/>
            <rect x="0" y="20" width="6" height="1.5" fill="#8a6d15"/>
            <rect x="0" y="34" width="6" height="1.5" fill="#8a6d15"/>
          </svg>
        </div>
        <div class="cloth-wrap">
          <svg width="90" height="50" viewBox="0 0 90 50" style="overflow:visible">
            <defs>
              <filter id="clothFilter" x="-20%" y="-50%" width="140%" height="200%">
                <feTurbulence type="fractalNoise" baseFrequency="0.02 0.09" numOctaves="2" seed="4" result="turb">
                  <animate attributeName="baseFrequency" values="0.015 0.08;0.025 0.1;0.015 0.08" dur="2.6s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="turb" scale="7" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
            </defs>
            <g class="flag-cloth-ripple" filter="url(#clothFilter)">
              <rect x="0" y="0" width="72" height="15.3" fill="#FF9933"/>
              <rect x="0" y="15.3" width="72" height="15.3" fill="#FFFFFF"/>
              <rect x="0" y="30.6" width="72" height="15.4" fill="#138808"/>
              <circle cx="36" cy="23" r="6" fill="none" stroke="#000080" stroke-width="0.9"/>
              <circle cx="36" cy="23" r="0.9" fill="#000080"/>
              <g stroke="#000080" stroke-width="0.32">
                <line x1="36" y1="17" x2="36" y2="29"/><line x1="30" y1="23" x2="42" y2="23"/>
                <line x1="31.8" y1="18.8" x2="40.2" y2="27.2"/><line x1="40.2" y1="18.8" x2="31.8" y2="27.2"/>
                <line x1="33.4" y1="17.6" x2="38.6" y2="28.4"/><line x1="38.6" y1="17.6" x2="33.4" y2="28.4"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <footer style="margin-top:14px; border-top:none;">Jai Hind.</footer>
</div>

<script>
const ICONS = {
  chain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 12a3 3 0 013-3h2M16 12a3 3 0 01-3 3h-2" stroke-linecap="round"/><circle cx="7" cy="12" r="3"/><circle cx="17" cy="12" r="3"/><path d="M4 4l4 4M20 4l-4 4" stroke-linecap="round"/></svg>`,
  flag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3v18" stroke-linecap="round"/><path d="M6 4h13l-3 4 3 4H6z" stroke-linejoin="round"/></svg>`,
  press: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="8" width="16" height="10" rx="1"/><path d="M7 8V5h10v3M8 12h8M8 15h5" stroke-linecap="round"/></svg>`,
  people: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.5"/><circle cx="16" cy="8" r="2.5"/><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5M11 19c0-3 2.5-5 5-5s5 2 5 5" stroke-linecap="round"/></svg>`,
  salt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l3 6-3 3-3-3z"/><path d="M9 12l3 3 3-3M6 21h12M8 21v-4l4-4 4 4v4"/></svg>`,
  charkha: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2M7.5 7.5l1.4 1.4M15.1 15.1l1.4 1.4M7.5 16.5l1.4-1.4M15.1 8.9l1.4-1.4" stroke-linecap="round"/></svg>`,
  scale: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M6 21h12" stroke-linecap="round"/><path d="M5 7h5M14 7h5" stroke-linecap="round"/><path d="M3 7l2 5a2.5 2.5 0 005 0l2-5M14 7l2 5a2.5 2.5 0 005 0l2-5" stroke-linejoin="round"/></svg>`,
  wound: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8M16 8l-8 8" stroke-linecap="round"/></svg>`,
  ship: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 15l2 5h12l2-5H4z"/><path d="M12 3v9M12 3l4 3-4 2-4-2z" stroke-linejoin="round"/></svg>`,
  doc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9 12h6M9 16h6" stroke-linecap="round"/></svg>`,
  torch: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2c1.5 2 2 3.5 1 5-.6 1-1.6 1.2-1 2.5.5-1 1.5-.8 2 0 .8 1.3-.3 2.8-2 2.8-2 0-3-1.5-2-3 .8-1.3-.3-2-0-3.5-.5-2.5.8-3.8 2-3.8z"/><path d="M12 12v9" stroke-linecap="round"/></svg>`,
  meeting: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4" stroke-linecap="round"/></svg>`,
  soldier: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="6" r="3"/><path d="M6 21v-5a6 6 0 0112 0v5" stroke-linecap="round"/></svg>`,
  split: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v6M12 8l-6 8M12 8l6 8M4 20h6M14 20h6" stroke-linecap="round"/></svg>`,
};

const EVENTS = [
  { era:1, year:"1857", tag:"Uprising", icon:"chain",
    title:"The Revolt of 1857",

let currentEra = 1;

function render(){
  const container = document.getElementById('timelineContent');
  const items = EVENTS.filter(e => e.era === currentEra);
  container.innerHTML = `<div class="era-block active">` + items.map((e, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const idx = EVENTS.indexOf(e);
    const spinClass = e.icon === 'charkha' ? ' spin-icon' : '';
    return `
    <div class="dispatch-row ${side}" style="animation-delay:${i * 0.09}s">
      <div class="stamp"><span class="yr">${e.year}</span></div>
      <div class="dispatch">
        <div class="dispatch-card" data-idx="${idx}">
          <div class="dh-top">
            <span class="dh-icon${spinClass}">${ICONS[e.icon]}</span>
            <span class="dh-tag">${e.tag}</span>
          </div>
          <div class="dh-title">${e.title}</div>
          <p class="dh-teaser">${e.teaser}</p>
          <div class="dh-full" id="full-${idx}">${e.full}</div>
          <div class="dh-toggle">Tap to <span class="toggle-label">read more</span><span class="dh-chevron" id="chev-${idx}">▾</span></div>
        </div>
      </div>
    </div>`;
  }).join('') + `</div>`;

  container.querySelectorAll('.dispatch-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = card.dataset.idx;
      const full = document.getElementById('full-'+idx);
      const label = card.querySelector('.toggle-label');
      const chev = document.getElementById('chev-'+idx);
      const opening = !full.classList.contains('show');
      full.classList.toggle('show');
      chev.classList.toggle('rotated');
      label.textContent = opening ? 'collapse' : 'read more';
      if(opening && EVENTS[idx].year === '1947'){
        burstConfetti();
      }
    });
  });

  // update meter based on era's midpoint year, with a moving badge
  const eraYearMap = { 1: 1880, 2: 1922, 3: 1947 };
  const targetYear = eraYearMap[currentEra];
  const pct = Math.round(((targetYear - 1857) / (1947 - 1857)) * 100);
  document.getElementById('meterFill').style.width = pct + '%';
  const badge = document.getElementById('meterBadge');
  badge.style.left = pct + '%';
  animateCountUp(badge, targetYear);
}

function animateCountUp(el, target){
  const start = parseInt(el.textContent) || 1857;
  const duration = 900;
  const startTime = performance.now();
  function step(now){
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = Math.round(start + (target - start) * eased);
    el.textContent = val;
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function burstConfetti(){
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  const colors = ['#FF9933', '#FFFFFF', '#138808', '#2c4a6e'];
  const count = 90;
  for(let i = 0; i < count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 5 + Math.random() * 6;
    piece.style.width = size + 'px';
    piece.style.height = (size * 0.4) + 'px';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    layer.appendChild(piece);
  }
  setTimeout(() => layer.remove(), 4200);
}

function typewriteDateline(){
  const el = document.getElementById('typeText');
  const full = "Ninety years of resistance, condensed — 1857 to 1947";
  let i = 0;
  el.textContent = '';
  function tick(){
    if(i <= full.length){
      el.textContent = full.slice(0, i);
      i++;
      setTimeout(tick, 22);
    } else {
      document.getElementById('datelineWrap').classList.add('done');
    }
  }
  tick();
}

document.getElementById('eraTabs').addEventListener('click', e => {
  const btn = e.target.closest('.era-tab');
  if(!btn) return;
  currentEra = +btn.dataset.era;
  document.querySelectorAll('.era-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
  window.scrollTo({ top: document.querySelector('.era-tabs').offsetTop - 20, behavior:'smooth' });
});

function hoistFlag(){
  const btn = document.getElementById('hoistBtn');
  const flag = document.getElementById('flagHoist');
  const ropeL = document.getElementById('ropeLeft');
  const ropeR = document.getElementById('ropeRight');

  // reset to furled/base state first so it can be replayed
  flag.classList.remove('hoisting', 'unfurled');
  ropeR.classList.remove('pulling');
  ropeL.classList.remove('paying-out');
  void flag.offsetWidth; // force reflow so the animation restarts cleanly

  btn.disabled = true;
  btn.textContent = 'Raising… 🪢';

  // rope pulls through the pulley as the flag climbs
  ropeR.classList.add('pulling');
  ropeL.classList.add('paying-out');
  flag.classList.add('hoisting');

  // unfurl begins just before the flag reaches the top, like a real rope-release
  setTimeout(() => {
    flag.classList.add('unfurled');
    btn.textContent = 'Unfurling… 🎏';
  }, 1900);

  setTimeout(() => {
    burstConfetti();
    btn.textContent = 'Jai Hind! 🇮🇳 · Replay';
    btn.disabled = false;
  }, 2700);
}

document.getElementById('hoistBtn').addEventListener('click', hoistFlag);

typewriteDateline();
render();

// Auto-play the hoist once, shortly after the page loads
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('hoistBtn').scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(hoistFlag, 500);
  }, 900);
});
</script>
